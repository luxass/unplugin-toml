ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true
packages:
  - examples/**

minimumReleaseAgeExclude:
  - "@luxass/utils@2.7.5"
  # Renovate security update: pnpm@11.8.0 || 11.11.0
  - pnpm@11.8.0 || 11.11.0
  # Renovate security update: smol-toml@1.7.1
  - smol-toml@1.7.1
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11

catalogs:
  dev:
    "@luxass/utils": 2.7.5
    "@nuxt/kit": 4.6.4
    "@nuxt/schema": 4.6.4
    "@rspack/core": 2.3.1
    "@types/node": 25.9.2
    esbuild: 0.28.2
    oxfmt: 0.54.0
    oxlint: 1.91.0
    oxlint-tsgolint: 7.0.2005
    publint: 0.3.21
    rolldown: 1.2.16
    rollup: 4.67.4
    tsdown: 0.22.2
    typescript: 6.0.3
    vite: 8.3.5
    vitest: 5.1.0
    vitest-testdirs: 4.4.3
    webpack: 5.112.2

  example:
    "@rspack/cli": 2.3.1
    "@rspack/dev-server": 2.2.2
    astro: 7.4.5

  runtime:
    "@rollup/pluginutils": 5.5.1
    smol-toml: 1.9.1
    unplugin: 3.7.0

onlyBuiltDependencies:
  - esbuild
