ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true
packages:
  - examples/**

minimumReleaseAgeExclude:
  - "@luxass/utils@2.7.5"
  # Renovate security update: pnpm@11.8.0 || 11.11.0
  - pnpm@11.8.0 || 11.11.0
  # Renovate security update: smol-toml@1.7.1
  - smol-toml@1.7.1
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11

catalogs:
  dev:
    "@luxass/utils": 2.7.5
    "@nuxt/kit": 4.5.2
    "@nuxt/schema": 4.5.2
    "@rspack/core": 2.2.8
    "@types/node": 25.9.9
    esbuild: 0.28.0
    oxfmt: 0.71.0
    oxlint: 1.69.0
    oxlint-tsgolint: 0.25.0
    publint: 0.3.25
    rolldown: 1.2.12
    rollup: 4.64.0
    tsdown: 0.23.0
    typescript: 6.0.3
    vite: 8.0.16
    vitest: 4.1.11
    vitest-testdirs: 4.5.1
    webpack: 5.111.1

  example:
    "@rspack/cli": 2.2.8
    "@rspack/dev-server": 2.2.1
    astro: 6.4.4

  runtime:
    "@rollup/pluginutils": 5.4.0
    smol-toml: 1.7.1
    unplugin: 3.4.0

onlyBuiltDependencies:
  - esbuild
